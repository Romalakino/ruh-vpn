id           = "vlad-dev/ruh-vpn"
name         = "Ruh VPN"
version      = "0.1.1"
plugin_api   = 3
author       = "Умеджон Базаров"
license      = "MIT"
icon         = "shield-lock"
description  = "VPN/proxy manager (sing-box): SSH, VLESS, VMess, Shadowsocks, SOCKS5, routing rules, kill switch."
tags         = ["bar", "panel", "service", "shortcut", "network", "privacy"]
dependencies = ["sing-box", "python3", "ssh", "sshpass", "gsettings", "pkexec", "setcap", "getcap", "nft", "pkill", "ip"]

# Plugin settings
[[setting]]
key            = "backend_python"
type           = "file"
label_key      = "settings.backend_python.label"
description_key = "settings.backend_python.description"
default        = "python3"

[[setting]]
key            = "auto_start"
type           = "bool"
label_key      = "settings.auto_start.label"
description_key = "settings.auto_start.description"
default        = false

[[setting]]
key            = "geoip_country"
type           = "bool"
label_key      = "settings.geoip_country.label"
description_key = "settings.geoip_country.description"
default        = true

# ---- ping / health ----
[[setting]]
key            = "ping_method"
type           = "select"
label_key      = "settings.ping_method.label"
description_key = "settings.ping_method.description"
default        = "tcp"
options        = [
  { value = "tcp",  label_key = "settings.ping_method.tcp" },
  { value = "http", label_key = "settings.ping_method.http" },
]

[[setting]]
key            = "ping_url"
type           = "string"
label_key      = "settings.ping_url.label"
description_key = "settings.ping_url.description"
default        = "https://www.gstatic.com/generate_204"
visible_when   = { key = "ping_method", values = ["http"] }

[[setting]]
key            = "ping_timeout_ms"
type           = "int"
label_key      = "settings.ping_timeout_ms.label"
description_key = "settings.ping_timeout_ms.description"
default        = 3000
min            = 200
max            = 30000
advanced       = true

[[setting]]
key            = "ping_count"
type           = "int"
label_key      = "settings.ping_count.label"
description_key = "settings.ping_count.description"
default        = 4
min            = 1
max            = 10
advanced       = true

[[setting]]
key            = "ping_concurrency"
type           = "int"
label_key      = "settings.ping_concurrency.label"
description_key = "settings.ping_concurrency.description"
default        = 16
min            = 1
max            = 64
advanced       = true

[[setting]]
key            = "health_interval"
type           = "int"
label_key      = "settings.health_interval.label"
description_key = "settings.health_interval.description"
default        = 30
min            = 5
max            = 600
advanced       = true

[[setting]]
key            = "auto_failover"
type           = "bool"
label_key      = "settings.auto_failover.label"
description_key = "settings.auto_failover.description"
default        = true

[[setting]]
key            = "control_port"
type           = "int"
label_key      = "settings.control_port.label"
description_key = "settings.control_port.description"
default        = 11090
min            = 1024
max            = 65535
advanced       = true

# Headless service: supervises the Python backend
[[service]]
id    = "vpn_service"
entry = "service.luau"

# Bar widget
[[widget]]
id    = "vpn_widget"
entry = "widget.luau"

  [[widget.setting]]
  key       = "show_ping"
  type      = "bool"
  label_key = "settings.show_ping.label"
  default   = true

  [[widget.setting]]
  key       = "show_traffic"
  type      = "bool"
  label_key = "settings.show_traffic.label"
  default   = false

# Main panel
[[panel]]
id        = "vpn_panel"
entry     = "panel.luau"
width     = 640
height    = 560
placement = "attached"
position  = "auto"

# Control-center tile
[[shortcut]]
id    = "vpn_toggle"
entry = "shortcut.luau"
